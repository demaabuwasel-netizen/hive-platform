<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" fill="none">
  <defs>
    <filter id="sh3">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0D183D" flood-opacity="0.09"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="380" fill="#F9F6EF"/>
  <circle cx="200" cy="200" r="155" fill="#FFF3CD" opacity="0.45"/>
  <circle cx="200" cy="200" r="105" fill="#FFE8A3" opacity="0.22"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="360" rx="90" ry="13" fill="#D4B880" opacity="0.35"/>

  <!-- Ground line / floor -->
  <line x1="80" y1="355" x2="320" y2="355" stroke="#E8DFC9" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Decorative elements -->
  <path d="M 62 96 L 64 88 L 66 96 L 74 98 L 66 100 L 64 108 L 62 100 L 54 98Z" fill="#FFB703" opacity="0.75"/>
  <circle cx="82" cy="80" r="5" fill="#FFD56A" opacity="0.65"/>
  <circle cx="52" cy="118" r="3.5" fill="#FFD56A" opacity="0.45"/>
  <path d="M 318 82 L 320 74 L 322 82 L 330 84 L 322 86 L 320 94 L 318 86 L 310 84Z" fill="#52B86A" opacity="0.65"/>
  <circle cx="338" cy="68" r="4.5" fill="#FFD56A" opacity="0.55"/>
  <circle cx="314" cy="106" r="3" fill="#4B7BF5" opacity="0.5"/>

